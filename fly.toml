# Fly.io config — `fly launch --copy-config` then `fly deploy`.
# Add a domain with `fly certs add yourdomain.com`.
app = "hone"
primary_region = "iad"

[build]

[env]
  HONE_PUBLIC = "1"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[checks]
  [checks.health]
    type = "http"
    port = 8000
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
