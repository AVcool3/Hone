<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hone — know your number</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎯</text></svg>">
<style>
  :root {
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;   /* target / primary */
    --series-2: #1baf7a;   /* current / secondary */
    --good: #006300;
    --critical: #d03b3b;
    --ramp-lo: #86b6ef;
    --ramp-hi: #0d366b;
    --accent-wash: rgba(42,120,214,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --ink-1: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #199e70;
      --good: #0ca30c;
      --critical: #d03b3b;
      --ramp-lo: #3987e5;
      --ramp-hi: #184f95;
      --accent-wash: rgba(57,135,229,0.16);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink-1);
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 20px 90px; }

  /* step header */
  .stepbar { display: flex; align-items: center; gap: 8px; margin: 6px 0 22px; }
  .stepbar .brand { font-weight: 800; letter-spacing: -0.01em; margin-right: 10px; }
  .stepbar .track { flex: 1; height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }
  .stepbar .track > div { height: 100%; background: var(--series-1); border-radius: 2px; transition: width 0.3s; }
  .stepbar .count { font-size: 12.5px; color: var(--ink-muted); white-space: nowrap; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 14px; padding: 26px; margin-bottom: 16px;
  }
  h1 { font-size: 24px; letter-spacing: -0.015em; margin-bottom: 6px; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  p.lead { color: var(--ink-2); margin-bottom: 14px; }
  .muted { color: var(--ink-muted); font-size: 13px; }

  /* nav row */
  .navrow { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
  button.primary {
    background: var(--series-1); color: #fff; border: none; border-radius: 9px;
    padding: 11px 22px; font-size: 15px; font-weight: 650; cursor: pointer; font-family: inherit;
  }
  button.primary:disabled { opacity: 0.45; cursor: default; }
  button.ghost {
    background: none; border: 1px solid var(--border); color: var(--ink-2);
    border-radius: 9px; padding: 10px 16px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  input[type=text], input[type=number], input[type=password], select {
    background: var(--page); color: var(--ink-1);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; font-size: 14px; font-family: inherit; width: 100%;
  }
  label.field { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
  label.field span { display: block; margin-bottom: 3px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  .row > button.v-del { flex: 0 0 auto; min-width: 0; align-self: flex-end; margin-bottom: 10px; }

  /* questionnaire */
  .lottery-pair { display: flex; gap: 12px; margin-top: 16px; }
  .lottery {
    flex: 1; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 18px; cursor: pointer; background: var(--surface-1);
  }
  .lottery:hover { border-color: var(--series-1); background: var(--accent-wash); }
  .lottery .tag { font-size: 12px; font-weight: 700; color: var(--ink-muted); letter-spacing: 0.06em; }
  .lottery .outcome { display: flex; justify-content: space-between; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .lottery .outcome b { font-weight: 650; }

  .hero { font-size: 46px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.05; }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .tile {
    flex: 1; min-width: 130px; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; background: var(--page);
  }
  .tile .k { font-size: 12px; color: var(--ink-muted); }
  .tile .v { font-size: 19px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  /* tier gauge (supports 2 markers) */
  .gauge { margin: 18px 0 4px; }
  .gauge .strip { display: flex; gap: 1px; height: 14px; border-radius: 4px; overflow: hidden; }
  .gauge .seg { flex: 1; }
  .gauge .marks { position: relative; height: 22px; margin-top: 4px; }
  .gauge .marks.tall { height: 44px; }
  .gauge .mark { position: absolute; transform: translateX(-50%); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
  .gauge .mark.row2 { top: 22px; }
  .gauge .mark::before { content: "▲"; display: block; text-align: center; font-size: 9px; color: var(--ink-1); }
  .gauge .axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .gauge .seg.hit-a { outline: 2px solid var(--ink-1); outline-offset: 1px; border-radius: 2px; }
  .gauge .seg.hit-b { outline: 2px dashed var(--critical); outline-offset: 1px; border-radius: 2px; }

  /* bars */
  .chart { margin-top: 12px; }
  .chart .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
  .chart .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .barrow { display: grid; grid-template-columns: 72px 1fr 74px; gap: 10px; align-items: center; margin-bottom: 6px; }
  .barrow .sym { font-size: 13px; color: var(--ink-2); text-align: right; }
  .barrow .val { font-size: 13px; font-variant-numeric: tabular-nums; }
  .track2 { position: relative; height: 14px; }
  .track2 .baseline { position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--baseline); }
  .bar { position: absolute; left: 0; height: 6px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar.t { top: 0; background: var(--series-1); }
  .bar.c { bottom: 0; background: var(--series-2); }
  .bar.single { top: 4px; background: var(--series-1); }
  .bar:hover { filter: brightness(1.15); }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th { text-align: left; color: var(--ink-muted); font-weight: 500; font-size: 12.5px;
       border-bottom: 1px solid var(--grid); padding: 6px 8px; }
  td { padding: 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; }
  .buy  { color: var(--good); font-weight: 600; }
  .sell { color: var(--critical); font-weight: 600; }
  tr.reason td { color: var(--ink-2); font-size: 13px; border-bottom: 1px solid var(--grid); padding-top: 0; }

  .hedge-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 10px; background: var(--page); }
  .hedge-card .kind { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--series-1); text-transform: uppercase; }
  .hedge-card p { margin-top: 4px; }
  .hedge-card .meta { color: var(--ink-2); font-size: 13px; margin-top: 6px; }

  .error { background: rgba(208,59,59,0.09); border: 1px solid rgba(208,59,59,0.35);
           color: var(--critical); border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 14px; }
  .note  { background: var(--accent-wash); border-radius: 8px; padding: 11px 13px; margin: 12px 0; font-size: 13.5px; color: var(--ink-2); }
  .spinner { color: var(--ink-muted); font-size: 14px; margin: 12px 0; }
  details.settings summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
  footer { color: var(--ink-muted); font-size: 12.5px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stepbar" id="stepbar" hidden>
    <span class="brand">Hone</span>
    <div class="track"><div id="step-fill"></div></div>
    <span class="count" id="step-count"></span>
  </div>
  <main id="page"></main>
  <footer>
    Analytical tooling, not investment advice. Option costs are indicative Black-Scholes
    values — use live quotes for execution. Alpaca integration targets the paper-trading API only.
  </footer>
</div>

<script>
"use strict";
/* ============================== state & utils ============================== */
const $id = (x) => document.getElementById(x);
const fmtPct = (x, dp=1) => (x*100).toFixed(dp) + "%";
const fmtSPct = (x, dp=1) => (x >= 0 ? "+" : "") + (x*100).toFixed(dp) + "%";
const fmtMoney = (x, dp=2) => "$" + Math.abs(x).toLocaleString(undefined, {minimumFractionDigits: dp, maximumFractionDigits: dp});
const fmtLoss = (x) => (x < 0 ? "−" : "") + fmtMoney(x, 0);

const STEPS = ["start", "quiz", "profile", "portfolio", "views", "optimize", "hedge", "done"];
const STEP_LABELS = {start:"Start", quiz:"Questionnaire", profile:"Your profile", portfolio:"Portfolio",
                     views:"Your views", optimize:"Rebalance", hedge:"Hedge", done:"Summary"};

let S = load();
function load() {
  try { return JSON.parse(localStorage.getItem("hone-state")) || {}; }
  catch { return {}; }
}
function save() { localStorage.setItem("hone-state", JSON.stringify(S)); }
function resetAll() { S = {}; save(); RUNTIME = {}; go("start"); }

/* results too large / transient for localStorage live here */
let RUNTIME = {};

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}
function marketBody() {
  const body = { demo: S.demo !== false };
  if (!body.demo && (S.alpacaKey || S.alpacaSecret)) {
    body.credentials = { api_key: S.alpacaKey || null, secret_key: S.alpacaSecret || null };
  }
  return body;
}

/* ================================= router ================================= */
function go(step) { location.hash = "#/" + step; }
function currentStep() {
  const h = (location.hash || "").replace(/^#\//, "");
  return STEPS.includes(h) ? h : "start";
}
function guard(step) {
  // send the user back to the earliest step whose prerequisites are missing
  // (portfolio is allowed without gamma: it can *derive* gamma from holdings)
  const needGamma = ["profile", "views", "optimize", "hedge", "done"];
  if (needGamma.includes(step) && typeof S.gamma !== "number") return "start";
  if ((step === "optimize" || step === "hedge" || step === "done") && !RUNTIME.optimize) {
    return typeof S.gamma === "number" ? "views" : "start";
  }
  return step;
}
window.addEventListener("hashchange", render);

function render() {
  let step = currentStep();
  const target = guard(step);
  if (target !== step) { go(target); return; }
  const idx = STEPS.indexOf(step);
  $id("stepbar").hidden = step === "start";
  $id("step-fill").style.width = (100 * idx / (STEPS.length - 1)) + "%";
  $id("step-count").textContent = `${STEP_LABELS[step]} · step ${idx} of ${STEPS.length - 1}`;
  PAGES[step]();
  window.scrollTo(0, 0);
}

function navRow(backStep, nextLabel, nextFn, extra="") {
  return `<div class="navrow">
    ${backStep ? `<button class="ghost" onclick="go('${backStep}')">&larr; Back</button>` : "<span></span>"}
    <span>${extra}</span>
    ${nextLabel ? `<button class="primary" id="next-btn">${nextLabel}</button>` : ""}
  </div>`;
}

/* =============================== components =============================== */
function rampColor(t) {
  const css = getComputedStyle(document.documentElement);
  const lo = css.getPropertyValue("--ramp-lo").trim(), hi = css.getPropertyValue("--ramp-hi").trim();
  const p = (s,i) => parseInt(s.slice(i, i+2), 16);
  const c = (a,b) => Math.round(a + (b-a) * t);
  return `rgb(${c(p(lo,1),p(hi,1))},${c(p(lo,3),p(hi,3))},${c(p(lo,5),p(hi,5))})`;
}
function gaugeHTML(markers) {
  // markers: [{tier, label, style:'a'|'b'}]
  let segs = "";
  for (let i = 1; i <= 50; i++) {
    const hit = markers.filter(m => m.tier === i).map(m => " hit-" + m.style).join("");
    segs += `<div class="seg${hit}" style="background:${rampColor((i-1)/49)}" title="Tier ${i}"></div>`;
  }
  // stagger labels onto a second row when markers sit close together
  const crowded = markers.length > 1 &&
    Math.abs(markers[0].tier - markers[1].tier) < 12;
  const marks = markers.map((m, i) =>
    `<div class="mark${crowded && i === 1 ? " row2" : ""}" style="left:${(m.tier - 0.5) * 2}%">${m.label}</div>`).join("");
  return `<div class="gauge">
    <div class="strip">${segs}</div>
    <div class="marks${crowded ? " tall" : ""}">${marks}</div>
    <div class="axis"><span>Tier 1 · risk-seeking</span><span>Tier 50 · risk-averse</span></div>
  </div>`;
}
function barsCompare(rows, maxW) {
  return rows.map(w => `
    <div class="barrow">
      <div class="sym">${w.symbol}</div>
      <div class="track2"><div class="baseline"></div>
        <div class="bar t" style="width:${100 * Math.max(w.target,0) / maxW}%" title="${w.symbol} target ${fmtPct(w.target)}"></div>
        <div class="bar c" style="width:${100 * Math.max(w.current,0) / maxW}%" title="${w.symbol} current ${fmtPct(w.current)}"></div>
      </div>
      <div class="val">${fmtPct(w.target)}</div>
    </div>`).join("");
}

/* ================================= pages ================================== */
const PAGES = {};

/* ------------------------------- 1. start -------------------------------- */
PAGES.start = () => {
  const demo = S.demo !== false;
  $id("page").innerHTML = `
  <div class="card">
    <h1>Know your number.</h1>
    <p class="lead">Hedge funds quantify risk tolerance before they invest a dollar —
    retail investors get a three-bucket quiz. Hone measures your personal
    risk-aversion parameter <b>γ</b> with the same experiment economists use,
    then makes your whole portfolio answer to it: what to hold, how to act on
    your convictions, and how to hedge what you can't stomach.</p>
    <p class="lead">Four stops: a <b>30-choice questionnaire</b> → your <b>risk profile</b>
    (1 of 50 tiers) → your <b>portfolio</b>, rebalanced around <b>your views</b> →
    a <b>hedge plan</b> sized to your number. In a hurry? You can also let Hone
    <b>read a γ straight out of your current portfolio</b> and skip the questionnaire.</p>

    <h2>Data source</h2>
    <label class="field" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="demo-mode" ${demo ? "checked" : ""} style="width:auto">
      Demo mode — synthetic portfolio, no brokerage account needed
    </label>
    <div class="row" id="cred-row" style="opacity:${demo ? 0.45 : 1}">
      <label class="field"><span>Alpaca API key (paper)</span>
        <input type="text" id="alpaca-key" placeholder="PK..." value="${S.alpacaKey || ""}" autocomplete="off"></label>
      <label class="field"><span>Alpaca secret key</span>
        <input type="password" id="alpaca-secret" value="${S.alpacaSecret || ""}" autocomplete="off"></label>
    </div>
    <div class="muted">Keys stay in this browser and are sent only with your requests — the server never stores them.
    Leave blank to use keys configured on the server, if any.</div>
    ${navRow(null, "Begin →", null,
      `<button class="ghost" id="from-portfolio">Read my γ from my portfolio</button>
       <button class="ghost" id="skip-quiz">I already know my γ</button>`)}
  </div>`;
  $id("demo-mode").onchange = (e) => { S.demo = e.target.checked; save(); $id("cred-row").style.opacity = e.target.checked ? 0.45 : 1; };
  const grab = () => { S.alpacaKey = $id("alpaca-key").value.trim(); S.alpacaSecret = $id("alpaca-secret").value.trim(); S.demo = $id("demo-mode").checked; save(); };
  $id("next-btn").onclick = () => { grab(); go("quiz"); };
  $id("from-portfolio").onclick = () => {
    grab(); S.gamma = null; S.profile = null; save(); go("portfolio");
  };
  $id("skip-quiz").onclick = () => {
    grab();
    const v = prompt("Enter your risk-aversion γ (e.g. 1.2 — from a previous Hone run):");
    const g = parseFloat(v);
    if (!isNaN(g)) { S.gamma = g; S.profile = null; save(); go("portfolio"); }
  };
};

/* -------------------------------- 2. quiz -------------------------------- */
let QUIZ = null;
PAGES.quiz = () => {
  $id("page").innerHTML = `<div class="card" id="quiz-card">
    <h1>Which would you rather play?</h1>
    <p class="lead">For each pair, pick the lottery you'd genuinely prefer —
    imagine the money is real. There are no right answers. (Keyboard: A / B)</p>
    <div class="spinner" id="q-spin">Loading menu…</div>
    <div id="q-body"></div>
  </div>`;
  startQuiz();
};
async function startQuiz() {
  try {
    if (!RUNTIME.menu) RUNTIME.menu = await api("/api/menu");
  } catch (e) { $id("q-body").innerHTML = `<div class="error">${e.message}</div>`; return; }
  $id("q-spin").remove();
  QUIZ = { flat: [], idx: 0, choices: RUNTIME.menu.map(() => []) };
  RUNTIME.menu.forEach((round, r) => round.rows.forEach(row => QUIZ.flat.push({ r, round, row })));
  renderQuestion();
}
function lotteryHTML(tag, lot) {
  const pHigh = Math.round(lot.p_high * 100);
  return `<div class="tag">OPTION ${tag}</div>
    <div class="outcome"><span>${pHigh}% chance</span><b>${fmtMoney(lot.high)}</b></div>
    <div class="outcome"><span>${100-pHigh}% chance</span><b>${fmtMoney(lot.low)}</b></div>`;
}
function renderQuestion() {
  const { r, round, row } = QUIZ.flat[QUIZ.idx];
  $id("q-body").innerHTML = `
    <div class="muted">Round ${r+1} of ${RUNTIME.menu.length} — ${round.label} · question ${row.number}/10
      · overall ${QUIZ.idx+1}/${QUIZ.flat.length}</div>
    <div class="lottery-pair">
      <div class="lottery" id="opt-a">${lotteryHTML("A", row.option_a)}</div>
      <div class="lottery" id="opt-b">${lotteryHTML("B", row.option_b)}</div>
    </div>
    <div class="navrow">
      <button class="ghost" id="q-back">&larr; ${QUIZ.idx === 0 ? "Exit" : "Back"}</button>
      <span class="muted">choice ${QUIZ.idx+1} of ${QUIZ.flat.length}</span><span></span>
    </div>`;
  $id("opt-a").onclick = () => answer("A");
  $id("opt-b").onclick = () => answer("B");
  $id("q-back").onclick = () => {
    if (QUIZ.idx === 0) { go("start"); return; }
    QUIZ.idx--; QUIZ.choices[QUIZ.flat[QUIZ.idx].r].pop(); renderQuestion();
  };
}
document.addEventListener("keydown", (e) => {
  if (currentStep() !== "quiz" || !QUIZ) return;
  if (e.key === "a" || e.key === "A") answer("A");
  if (e.key === "b" || e.key === "B") answer("B");
});
async function answer(c) {
  QUIZ.choices[QUIZ.flat[QUIZ.idx].r].push(c);
  QUIZ.idx++;
  if (QUIZ.idx < QUIZ.flat.length) { renderQuestion(); return; }
  $id("q-body").innerHTML = `<div class="spinner">Estimating your risk-aversion parameter…</div>`;
  try {
    const p = await api("/api/questionnaire", { choices: QUIZ.choices });
    S.gamma = p.gamma; S.profile = p; save();
    RUNTIME.optimize = null;
    go("profile");
  } catch (e) {
    $id("q-body").innerHTML = `<div class="error">${e.message}</div>
      <div class="navrow"><button class="ghost" onclick="go('start')">&larr; Start over</button></div>`;
  }
}

/* ------------------------------ 3. profile ------------------------------- */
PAGES.profile = () => {
  const p = S.profile;
  if (!p) { go("portfolio"); return; }
  const ci = p.gamma_ci95 ? `${p.gamma_ci95[0].toFixed(2)} … ${p.gamma_ci95[1].toFixed(2)}` : "—";
  const consistent = p.monotone.every(Boolean);
  $id("page").innerHTML = `
  <div class="card">
    <h1>Your risk profile</h1>
    <div class="hero">γ = ${p.gamma.toFixed(3)}</div>
    <div class="muted">Tier ${p.tier.tier} of ${p.tier.num_tiers} — ${p.tier.category}</div>
    ${gaugeHTML([{tier: p.tier.tier, label: "you", style: "a"}])}
    <div class="tiles">
      <div class="tile"><div class="k">Switch-point bounds</div><div class="v">${p.interval[0].toFixed(2)} … ${p.interval[1].toFixed(2)}</div></div>
      <div class="tile"><div class="k">95% confidence (MLE)</div><div class="v">${ci}</div></div>
      <div class="tile"><div class="k">Decision noise μ</div><div class="v">${p.mu.toFixed(3)}</div></div>
      <div class="tile"><div class="k">Choices used</div><div class="v">${p.n_obs}</div></div>
    </div>
    <div class="note">${consistent
      ? "Your choices were internally consistent — the estimate is sharp."
      : "Some rounds had multiple switch points; the noise parameter μ absorbs that inconsistency."}
      Next: let's see how the portfolio you <i>actually hold</i> compares to this number.</div>
    ${navRow("quiz", "See my portfolio →")}
  </div>`;
  $id("next-btn").onclick = () => go("portfolio");
};

/* ----------------------------- 4. portfolio ------------------------------ */
PAGES.portfolio = () => {
  $id("page").innerHTML = `<div class="card">
    <h1>Your portfolio</h1>
    <p class="lead">These holdings power everything downstream: the risk engine
    measures how they move together, and your current weights become the
    starting point for the rebalance.</p>
    <div class="spinner" id="p-spin">Loading holdings & measuring risk…</div>
    <div id="p-body"></div>
  </div>`;
  loadPortfolio();
};
async function loadPortfolio() {
  try {
    const body = Object.assign(marketBody(), { analyze: true, stated_gamma: S.gamma ?? null });
    const data = await api("/api/portfolio", body);
    RUNTIME.portfolio = data;
    if (data.portfolio_value) { S.portfolioValue = data.portfolio_value; save(); }
    renderPortfolio(data);
  } catch (e) {
    $id("p-spin").remove();
    $id("p-body").innerHTML = `<div class="error">${e.message}</div>
      <div class="navrow"><button class="ghost" onclick="go('start')">&larr; Data source</button>
      <button class="primary" onclick="loadPortfolio()">Retry</button></div>`;
  }
}
function renderPortfolio(data) {
  $id("p-spin")?.remove();
  const pos = data.positions;
  const maxW = Math.max(...pos.map(p => Math.abs(p.weight)));
  const bars = pos.map(p => `
    <div class="barrow">
      <div class="sym">${p.symbol}</div>
      <div class="track2"><div class="baseline"></div>
        <div class="bar single" style="width:${100*Math.abs(p.weight)/maxW}%" title="${p.symbol} ${fmtPct(p.weight)}"></div></div>
      <div class="val">${fmtPct(p.weight)}</div>
    </div>`).join("");

  let insight = "";
  const a = data.analysis;
  const deriving = typeof S.gamma !== "number";  // portfolio-derived gamma path
  if (a) {
    const markers = [{tier: a.revealed_tier.tier, label: "your portfolio", style: "b"}];
    if (a.stated_tier) markers.push({tier: a.stated_tier.tier, label: "your answers", style: "a"});
    const gap = a.stated_tier ? a.stated_tier.tier - a.revealed_tier.tier : null;
    let verdict = "";
    if (gap !== null) {
      if (Math.abs(gap) <= 4) verdict = "Your portfolio's risk is roughly in line with your stated preferences. The next steps will fine-tune it.";
      else if (gap > 0) verdict = `<b>Gap detected:</b> your answers say Tier ${a.stated_tier.tier} (${a.stated_tier.category.toLowerCase()}), but your holdings are invested like Tier ${a.revealed_tier.tier} — <b>${gap} tiers riskier than you say you can stomach</b>. The rebalance and hedge steps will close that gap.`;
      else verdict = `<b>Gap detected:</b> your answers say Tier ${a.stated_tier.tier}, but your holdings are invested like Tier ${a.revealed_tier.tier} — <b>${-gap} tiers more conservative than your stated tolerance</b>. You may be leaving expected return on the table.`;
    } else if (deriving) {
      verdict = `Your holdings imply <b>γ ≈ ${a.revealed_gamma.toFixed(2)} — Tier ${a.revealed_tier.tier} of 50</b> (${a.revealed_tier.category.toLowerCase()}). You can adopt this as your working risk parameter below, or take the 5-minute questionnaire for a preference-based measurement (recommended: the portfolio only shows how you're positioned, not how much risk you can actually stomach).`;
    }
    insight = `
    <h2>Stated vs. revealed risk appetite</h2>
    ${gaugeHTML(markers)}
    <div class="tiles">
      <div class="tile"><div class="k">Portfolio volatility</div><div class="v">${fmtPct(a.volatility)}</div><div class="s">annualized</div></div>
      <div class="tile"><div class="k">Market beta</div><div class="v">${a.beta.toFixed(2)}</div><div class="s">vs SPY</div></div>
      <div class="tile"><div class="k">Revealed γ</div><div class="v">${a.revealed_gamma.toFixed(2)}</div><div class="s">implied by holdings*</div></div>
      ${a.stated_gamma != null ? `<div class="tile"><div class="k">Stated γ</div><div class="v">${a.stated_gamma.toFixed(2)}</div><div class="s">from questionnaire</div></div>` : ""}
    </div>
    ${verdict ? `<div class="note">${verdict}</div>` : ""}
    <div class="muted">*Assumes a ${fmtPct(a.market_premium_assumption, 0)}/yr market risk premium; a positioning diagnostic, not a preference measurement.</div>`;
  }

  const nextLabel = deriving && a
    ? `Use γ = ${a.revealed_gamma.toFixed(2)} → add views`
    : "Add my views →";
  const extra = deriving && a
    ? `<button class="ghost" id="take-quiz">Take the questionnaire instead</button>`
    : (a && a.stated_tier && Math.abs(a.stated_tier.tier - a.revealed_tier.tier) > 4
        ? `<button class="ghost" id="adopt-revealed">Use revealed γ (${a.revealed_gamma.toFixed(2)}) instead</button>`
        : "");
  $id("p-body").innerHTML = `
    ${data.portfolio_value ? `<div class="tiles"><div class="tile"><div class="k">Portfolio value</div><div class="v">${fmtMoney(data.portfolio_value, 0)}</div><div class="s">${data.demo ? "demo account" : "Alpaca paper account"}</div></div></div>` : ""}
    <h2>Current weights</h2>
    <div class="chart">${bars}</div>
    ${insight}
    ${navRow(S.profile ? "profile" : "start", nextLabel, null, extra)}`;
  $id("next-btn").onclick = () => {
    if (deriving && a) { S.gamma = a.revealed_gamma; S.profile = null; save(); }
    go("views");
  };
  const quizBtn = $id("take-quiz");
  if (quizBtn) quizBtn.onclick = () => go("quiz");
  const adoptBtn = $id("adopt-revealed");
  if (adoptBtn) adoptBtn.onclick = () => {
    S.gamma = a.revealed_gamma; save();
    RUNTIME.optimize = null;
    go("views");
  };
}

/* ------------------------------- 5. views -------------------------------- */
PAGES.views = () => {
  $id("page").innerHTML = `<div class="card">
    <h1>Your views</h1>
    <p class="lead">Have conviction about a stock? Name it, give a target price,
    say how confident you are, and the optimizer will blend it against market
    equilibrium — trusted exactly as much as you trust it. No views is fine
    too: you'll get a pure risk-based rebalance.</p>
    <div id="views-list"></div>
    <button class="ghost" id="add-view" style="margin-top:8px">+ Add a view</button>
    <div class="row" style="margin-top:16px">
      <label class="field" style="max-width:220px"><span>Max weight per stock</span>
        <input type="number" id="opt-maxw" step="0.05" min="0.05" max="1" value="${S.maxWeight ?? 0.35}"></label>
      <label class="field" style="max-width:220px"><span>Your γ</span>
        <input type="number" id="opt-gamma" step="0.05" value="${(S.gamma ?? 1.2).toFixed(2)}"></label>
    </div>
    <div id="v-error"></div>
    ${navRow("portfolio", "Optimize my portfolio →")}
  </div>`;
  const list = $id("views-list");
  const addRow = (v={}) => {
    const div = document.createElement("div");
    div.className = "row view-row";
    div.innerHTML = `
      <label class="field"><span>Ticker</span><input type="text" class="v-ticker" placeholder="TSLA" value="${v.ticker||""}"></label>
      <label class="field"><span>Target price $</span><input type="number" class="v-target" step="0.01" min="0" value="${v.target_price||""}"></label>
      <label class="field"><span>Confidence (0–1)</span><input type="number" class="v-conf" step="0.05" min="0.05" max="1" value="${v.confidence||0.5}"></label>
      <label class="field"><span>Horizon (days)</span><input type="number" class="v-days" step="1" min="7" value="${v.horizon_days||365}"></label>
      <button class="ghost v-del">✕</button>`;
    div.querySelector(".v-del").onclick = () => div.remove();
    list.appendChild(div);
  };
  (S.views && S.views.length ? S.views : [{}]).forEach(addRow);
  $id("add-view").onclick = () => addRow();
  $id("next-btn").onclick = async () => {
    S.views = [...document.querySelectorAll(".view-row")].map(r => ({
      ticker: r.querySelector(".v-ticker").value.trim().toUpperCase(),
      target_price: parseFloat(r.querySelector(".v-target").value),
      confidence: parseFloat(r.querySelector(".v-conf").value),
      horizon_days: parseFloat(r.querySelector(".v-days").value),
    })).filter(v => v.ticker && v.target_price > 0);
    S.maxWeight = parseFloat($id("opt-maxw").value) || 0.35;
    S.gamma = parseFloat($id("opt-gamma").value);
    save();
    $id("next-btn").disabled = true;
    $id("v-error").innerHTML = `<div class="spinner">Optimizing…</div>`;
    try {
      const body = Object.assign(marketBody(), {
        gamma: S.gamma, views: S.views, max_weight: S.maxWeight,
        portfolio_value: S.portfolioValue ?? null,
      });
      RUNTIME.optimize = await api("/api/optimize", body);
      go("optimize");
    } catch (e) {
      $id("v-error").innerHTML = `<div class="error">${e.message}</div>`;
      $id("next-btn").disabled = false;
    }
  };
};

/* ------------------------------ 6. optimize ------------------------------ */
PAGES.optimize = () => {
  const r = RUNTIME.optimize;
  const value = r.hedge_plan.portfolio_value || S.portfolioValue;
  const dollarRet = value ? ` <span class="s">(≈ ${fmtMoney(r.expected_return*value,0)}/yr on ${fmtMoney(value,0)})</span>` : "";
  let returnsBlock = "";
  if (r.returns) {
    returnsBlock = `
    <h2>What your views did to expected returns</h2>
    ${r.views.map(v => `<div class="note">${v.description}</div>`).join("")}
    <table><tr><th>Asset</th><th class="num">Equilibrium</th><th class="num">With your views</th><th class="num">Tilt</th></tr>
    ${r.returns.map(x => `<tr><td>${x.symbol}</td><td class="num">${fmtSPct(x.prior)}</td>
      <td class="num">${fmtSPct(x.posterior)}</td>
      <td class="num" style="color:${x.tilt >= 0 ? "var(--good)" : "var(--critical)"}">${fmtSPct(x.tilt)}</td></tr>`).join("")}
    </table>`;
  }
  const maxW = Math.max(...r.weights.map(w => Math.max(w.current, w.target)));
  const trades = r.weights.filter(w => Math.abs(w.trade) >= 0.0005).sort((a,b) => a.trade - b.trade);
  const tradeRows = trades.map(t => `
    <tr><td class="${t.trade > 0 ? "buy" : "sell"}">${t.trade > 0 ? "BUY" : "SELL"}</td>
      <td>${t.symbol}</td><td class="num">${fmtPct(Math.abs(t.trade))}${value ? ` <span class="muted">(${fmtMoney(Math.abs(t.trade)*value,0)})</span>` : ""}</td>
      <td class="num">${fmtPct(t.current)} → ${fmtPct(t.target)}</td></tr>
    ${t.reason ? `<tr class="reason"><td></td><td colspan="3">${t.reason}</td></tr>` : ""}`).join("");

  $id("page").innerHTML = `<div class="card">
    <h1>Your rebalanced portfolio</h1>
    <p class="lead">Optimized for Tier ${r.tier.tier} (${r.tier.category.toLowerCase()}, γ = ${r.gamma.toFixed(2)}).</p>
    <div class="tiles">
      <div class="tile"><div class="k">Expected return</div><div class="v">${fmtSPct(r.expected_return)}</div><div class="s">${value ? `≈ ${fmtMoney(r.expected_return*value,0)}/yr` : "annualized"}</div></div>
      <div class="tile"><div class="k">Volatility</div><div class="v">${fmtPct(r.volatility)}</div><div class="s">annualized</div></div>
      <div class="tile"><div class="k">Certainty equivalent</div><div class="v">${fmtSPct(r.utility)}</div><div class="s">risk-adjusted, at your γ</div></div>
    </div>
    ${returnsBlock}
    <h2>Weights: current vs. target</h2>
    <div class="chart">
      <div class="legend"><span><i style="background:var(--series-1)"></i>Target</span>
        <span><i style="background:var(--series-2)"></i>Current</span></div>
      ${barsCompare(r.weights, maxW)}
    </div>
    <h2>Trades to get there — and why</h2>
    ${trades.length ? `<table><tr><th>Action</th><th>Symbol</th><th class="num">Amount</th><th class="num">Current → target</th></tr>${tradeRows}</table>`
      : `<div class="note">No trades needed — you're already at the optimum.</div>`}
    ${navRow("views", "Check my downside →")}
  </div>`;
  $id("next-btn").onclick = () => go("hedge");
};

/* -------------------------------- 7. hedge ------------------------------- */
PAGES.hedge = () => {
  const plan = RUNTIME.optimize.hedge_plan;
  const value = plan.portfolio_value;
  let scenarioBlock = "";
  if (plan.scenarios && plan.scenarios.length) {
    scenarioBlock = `
    <h2>If history repeats: your portfolio in past crashes</h2>
    <table><tr><th>Scenario</th><th class="num">Market</th><th class="num">Your loss</th>
      ${plan.needs_hedge ? '<th class="num">With short hedge</th>' : ""}</tr>
    ${plan.scenarios.map(x => `<tr><td>${x.name}</td>
      <td class="num">${fmtSPct(x.market_shock, 0)}</td>
      <td class="num" style="color:var(--critical)">${fmtLoss(x.loss_usd)} (${fmtSPct(x.loss_fraction,0)})</td>
      ${plan.needs_hedge ? `<td class="num" style="color:var(--good)">${x.hedged_loss_usd != null ? fmtLoss(x.hedged_loss_usd) : "—"}</td>` : ""}</tr>`).join("")}
    </table>
    <div class="muted">First-order (beta) approximation on ${value ? fmtMoney(value,0) : "your portfolio"}.</div>`;
  }
  const budget = value ? `
    <div class="tiles">
      <div class="tile"><div class="k">Your risk budget</div><div class="v">${fmtMoney(plan.tolerable_annual_loss_usd,0)}</div><div class="s">worst-year loss your tier tolerates*</div></div>
      <div class="tile"><div class="k">Current exposure</div><div class="v">${fmtMoney(plan.current_annual_loss_usd,0)}</div><div class="s">worst-year loss you're carrying*</div></div>
      <div class="tile"><div class="k">Volatility</div><div class="v">${fmtPct(plan.current_volatility)} → ${fmtPct(plan.target_volatility)}</div><div class="s">current → your budget</div></div>
    </div>
    <div class="muted">*≈95% one-year value-at-risk (1.65σ), a rule-of-thumb bound, not a guarantee.</div>` : "";

  const cards = plan.suggestions.map(sug => `
    <div class="hedge-card">
      <div class="kind">${sug.kind.replace("_"," ")}</div>
      <p>${sug.description}</p>
      <div class="meta">${sug.hedged_volatility != null ? `Hedged volatility ≈ ${fmtPct(sug.hedged_volatility)} · ` : ""}
        Est. cost ≈ ${fmtPct(sug.est_annual_cost_fraction)} of portfolio/yr${value ? ` (${fmtMoney(sug.est_annual_cost_fraction*value,0)})` : ""}</div>
    </div>`).join("");

  $id("page").innerHTML = `<div class="card">
    <h1>Hedging to your number</h1>
    <p class="lead">${plan.needs_hedge
      ? "Your rebalanced portfolio still runs hotter than your tier's risk budget. Three ways to bring it down without selling your stocks:"
      : "Good news — your rebalanced portfolio already sits within your tier's risk budget. No hedge needed; here's the downside picture anyway."}</p>
    ${budget}
    ${scenarioBlock}
    ${plan.needs_hedge ? `<h2>Hedge options</h2>${cards}` : ""}
    ${navRow("optimize", "Finish →")}
  </div>`;
  $id("next-btn").onclick = () => go("done");
};

/* -------------------------------- 8. done -------------------------------- */
PAGES.done = () => {
  const r = RUNTIME.optimize;
  const plan = r.hedge_plan;
  const topTrades = r.weights.filter(w => Math.abs(w.trade) >= 0.0005)
    .sort((a,b) => Math.abs(b.trade) - Math.abs(a.trade)).slice(0, 5);
  $id("page").innerHTML = `<div class="card">
    <h1>Your plan, on one page</h1>
    <div class="tiles">
      <div class="tile"><div class="k">Risk profile</div><div class="v">Tier ${r.tier.tier}/50</div><div class="s">γ = ${r.gamma.toFixed(2)} · ${r.tier.category}</div></div>
      <div class="tile"><div class="k">Portfolio after rebalance</div><div class="v">${fmtSPct(r.expected_return)}</div><div class="s">expected, at ${fmtPct(r.volatility)} volatility</div></div>
      <div class="tile"><div class="k">Hedge</div><div class="v">${plan.needs_hedge ? "Recommended" : "Not needed"}</div><div class="s">${plan.needs_hedge ? "see hedge options" : "within your risk budget"}</div></div>
    </div>
    <h2>Action list</h2>
    <table><tr><th>#</th><th>Action</th></tr>
      ${topTrades.map((t,i) => `<tr><td>${i+1}</td><td><span class="${t.trade>0?"buy":"sell"}">${t.trade>0?"BUY":"SELL"}</span>
        ${t.symbol} — ${fmtPct(Math.abs(t.trade))} of portfolio</td></tr>`).join("")}
      ${plan.needs_hedge ? `<tr><td>${topTrades.length+1}</td><td>Add one hedge from the previous page (short / put / collar)</td></tr>` : ""}
      <tr><td>${topTrades.length + (plan.needs_hedge?2:1)}</td><td>Re-take the questionnaire quarterly — preferences drift</td></tr>
    </table>
    <div class="note">This is decision support, not investment advice. Execute through your broker;
    for options use live quotes, not the indicative costs shown here.</div>
    ${navRow("hedge", "Start over", null)}
  </div>`;
  $id("next-btn").onclick = resetAll;
};

/* ================================== boot ================================== */
render();
</script>
</body>
</html>
