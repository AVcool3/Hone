[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hone"
version = "0.1.0"
description = "Hedge-fund-grade risk aversion tools for retail investors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "requests>=2.31",
    # fastapi is a core dependency (not just a [web] extra): serverless
    # builders (e.g. Vercel) install from pyproject dependencies and
    # skip extras, and the web app must boot there.
    "fastapi>=0.110",
]

[project.optional-dependencies]
web = ["uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.scripts]
hone = "hone.cli:main"

[tool.setuptools.packages.find]
include = ["hone*"]

[tool.setuptools.package-data]
"hone.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
