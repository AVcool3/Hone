[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hone"
version = "0.1.0"
description = "Hedge-fund-grade risk aversion tools for retail investors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.scripts]
hone = "hone.cli:main"

[tool.setuptools.packages.find]
include = ["hone*"]

[tool.setuptools.package-data]
"hone.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
